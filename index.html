<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <title>COLOR-O-MATIC</title>
    <link rel="stylesheet" href="mainPageStyles.css">

</head>

<body>

    <!-- Top navigation bar, has the title and the history button. -->
    <header class="topbar">

        <h1>COLOR-O-MATIC</h1>
        <button id="showHistoryButton">History</button>

    </header>

    <!-- The rest of the page. Divided into two sides the video and the info side. -->
    <main class="layout">

        <!-- This is the side where the video is shown. -->
        <div class="VideoPlayerSide">
            <canvas id="canvas" width="400" height="400"></canvas>
            <video id="liveVideo" autoplay muted playsinline style="display:none"></video>
        </div>

        <!-- This is the side where the color, closest name and hex are shown. -->
        <div class="infoSide" id="infoSide">
            <div class="infoTop">

                <div id="hexBox"></div>
                <div id="colorName"></div>

            </div>

            <!-- Freeze button to stop the camera and to save the color to history. -->
            <button id="freezeButton">FREEZE / SAVE</button>

        </div>
    </main>

    <script type="module" src="mainPageScript.js"> </script>

</body>

</html>
